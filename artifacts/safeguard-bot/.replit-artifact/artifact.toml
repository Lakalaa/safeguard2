kind = "web"
previewPath = "/"
title = "Safeguard Bot Dashboard"
version = "1.0.0"
id = "artifacts/safeguard-bot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20760

[services.development]
run = "pnpm --filter @workspace/safeguard-bot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/safeguard-bot", "run", "build" ]
publicDir = "artifacts/safeguard-bot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20760"
BASE_PATH = "/"
