services:
  - type: web
    name: safeguard-bot
    runtime: node
    plan: free
    buildCommand: pnpm install && BASE_PATH=/ pnpm --filter @workspace/safeguard-bot run build && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
